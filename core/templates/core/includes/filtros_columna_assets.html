<style>
    .fc-th { position: relative; white-space: nowrap; }
    .fc-btn {
        background: none; border: 0; padding: 0; margin: 0; cursor: pointer;
        font: inherit; color: inherit; text-transform: inherit; letter-spacing: inherit;
        display: inline-flex; align-items: center; gap: 6px;
    }
    .fc-btn:hover, .fc-btn:focus-visible { color: #0070f2; outline: none; }
    .fc-btn:focus-visible { box-shadow: 0 0 0 2px #0070f2; border-radius: 2px; }
    .fc-chev { font-size: 0.65rem; }
    .fc-ind { font-size: 0.7rem; color: #0070f2; }
    .fc-activo .fc-btn { color: #0070f2; }

    .fc-pop {
        position: fixed; z-index: 90; width: 268px; box-sizing: border-box;
        background: #fff; border: 1px solid #d9d9d9; border-radius: 4px;
        box-shadow: 0 6px 18px rgba(0, 0, 0, 0.2); padding: 14px 16px 16px;
        text-transform: none; letter-spacing: 0; font-weight: 400; color: #32363a; font-size: 0.88rem;
        white-space: normal; text-align: left;
    }
    .fc-pop[hidden] { display: none; }
    .fc-pop-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; font-size: 1.05rem; font-weight: 600; }
    .fc-close { background: none; border: 0; font-size: 1.5rem; line-height: 1; cursor: pointer; color: #32363a; padding: 0 4px; }
    .fc-close:hover { color: #bb0000; }
    .fc-pop select, .fc-pop input.fc-val {
        width: 100%; box-sizing: border-box; padding: 8px 10px; margin-bottom: 12px;
        border: 1px solid #d9d9d9; border-radius: 2px; font: inherit; background: #fff; color: #32363a;
    }
    .fc-pop select:focus, .fc-pop input.fc-val:focus { outline: 2px solid #0070f2; outline-offset: -1px; }
    .fc-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 4px; }
    .fc-actions button {
        padding: 7px 18px; border-radius: 2px; border: 1px solid #d9d9d9; background: #fff;
        font: inherit; font-weight: 600; cursor: pointer; color: #32363a;
    }
    .fc-aplicar { background: #0070f2 !important; border-color: #0070f2 !important; color: #fff !important; }
    .fc-actions button:disabled { background: #f3f3f3 !important; border-color: #e4e4e4 !important; color: #a19f9d !important; cursor: not-allowed; }
</style>

<script>
(function () {
    var form = document.getElementById('filtros-form');
    var SIN_VALOR = ['tiene', 'vacio'];
    var abierto = null;

    function cerrar(devolverFoco) {
        if (!abierto) return;
        var th = abierto;
        var btn = th.querySelector('.fc-btn');
        th.querySelector('.fc-pop').hidden = true;
        btn.setAttribute('aria-expanded', 'false');
        abierto = null;
        if (devolverFoco) btn.focus();
    }

    function posicionar(th) {
        var pop = th.querySelector('.fc-pop');
        var r = th.querySelector('.fc-btn').getBoundingClientRect();
        var w = pop.offsetWidth || 268;
        pop.style.top = (r.bottom + 6) + 'px';
        pop.style.left = Math.max(8, Math.min(r.left, window.innerWidth - w - 8)) + 'px';
    }

    // Muestra/oculta el valor según el operador y habilita "Aplicar" solo si hay un cambio válido.
    function actualizar(th) {
        var op = th.querySelector('.fc-op').value;
        var val = th.querySelector('.fc-val');
        var sinValor = SIN_VALOR.indexOf(op) !== -1;
        val.style.display = sinValor ? 'none' : '';
        var aplicadoOp = th.querySelector('[data-fc-op]').value;
        var aplicadoVal = th.querySelector('[data-fc-val]').value;
        var valido = sinValor || val.value.trim() !== '';
        var cambio = op !== aplicadoOp || (!sinValor && val.value.trim() !== aplicadoVal);
        th.querySelector('.fc-aplicar').disabled = !(valido && cambio);
    }

    function abrir(th) {
        if (abierto && abierto !== th) cerrar(false);
        var pop = th.querySelector('.fc-pop');
        pop.hidden = false;
        th.querySelector('.fc-btn').setAttribute('aria-expanded', 'true');
        abierto = th;
        posicionar(th);
        actualizar(th);
        var val = th.querySelector('.fc-val');
        (val.style.display === 'none' ? th.querySelector('.fc-op') : val).focus({ preventScroll: true });
    }

    function enviar(th, op, val) {
        th.querySelector('[data-fc-op]').value = op;
        th.querySelector('[data-fc-val]').value = val;
        form.submit();   // GET: los filtros quedan en la URL (historial y recarga correctos)
    }

    document.addEventListener('click', function (e) {
        var t = e.target;
        var btn = t.closest('.fc-btn');
        if (btn) {
            var th = btn.closest('.fc-th');
            if (abierto === th) cerrar(false); else abrir(th);
            return;
        }
        if (t.closest('.fc-close')) { cerrar(true); return; }
        var aplicar = t.closest('.fc-aplicar');
        if (aplicar && !aplicar.disabled) {
            var thA = aplicar.closest('.fc-th');
            var op = thA.querySelector('.fc-op').value;
            var sinValor = SIN_VALOR.indexOf(op) !== -1;
            enviar(thA, op, sinValor ? '' : thA.querySelector('.fc-val').value.trim());
            return;
        }
        var borrar = t.closest('.fc-borrar');
        if (borrar && !borrar.disabled) { enviar(borrar.closest('.fc-th'), '', ''); return; }
        if (abierto && !abierto.contains(t)) cerrar(false);   // clic fuera del panel
    });

    document.addEventListener('change', function (e) {
        if (e.target.classList.contains('fc-op')) actualizar(e.target.closest('.fc-th'));
    });
    document.addEventListener('input', function (e) {
        if (e.target.classList.contains('fc-val')) actualizar(e.target.closest('.fc-th'));
    });
    document.addEventListener('keydown', function (e) {
        if (e.key === 'Escape') { cerrar(true); return; }
        if (e.key === 'Enter' && e.target.classList.contains('fc-val')) {
            e.preventDefault();
            var ap = e.target.closest('.fc-th').querySelector('.fc-aplicar');
            if (!ap.disabled) ap.click();
        }
    });
    window.addEventListener('resize', function () { cerrar(false); });
    window.addEventListener('scroll', function (e) {
        if (abierto && !abierto.contains(e.target)) cerrar(false);
    }, true);
})();
</script>
