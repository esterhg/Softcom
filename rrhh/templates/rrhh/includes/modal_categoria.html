{# Modal "Nueva categoría" (Bootstrap 4 de Jazzmin). Vuelve a la página de origen (?next=). #}
<div class="modal fade rh-modal" id="modalCategoria" data-backdrop="static" data-keyboard="false" tabindex="-1" role="dialog" aria-labelledby="modalCategoriaLabel" aria-hidden="true">
    <div class="modal-dialog" role="document">
        <form class="modal-content" method="post" action="{% url 'rrhh:crear_categoria' %}">
            {% csrf_token %}
            <input type="hidden" name="next" value="{{ next_url }}">
            <div class="modal-header">
                <h5 class="modal-title" id="modalCategoriaLabel">Nueva categoría</h5>
                <button type="button" class="close" data-dismiss="modal" aria-label="Cerrar"><span aria-hidden="true">&times;</span></button>
            </div>
            <div class="modal-body">
                <label class="rh-label" for="id_nombre_categoria">Nombre *</label>
                <input type="text" name="nombre" id="id_nombre_categoria" class="form-control" maxlength="80" required
                       placeholder="Ej. Bienes Afectos, Nocturna, Feriado">
                {% if categorias %}
                <div class="mt-3 rh-muted" style="font-size:.82rem;">
                    Existentes:
                    {% for c in categorias %}<span class="badge-sap {% if c.activa %}b-info{% else %}b-pend{% endif %}">{{ c.nombre }}</span> {% endfor %}
                </div>
                {% endif %}
            </div>
            <div class="modal-footer">
                <button type="button" class="btn-sap" data-dismiss="modal">Cancelar</button>
                <button type="submit" class="btn-sap btn-sap-primary"><i class="fas fa-tags"></i> Crear categoría</button>
            </div>
        </form>
    </div>
</div>
