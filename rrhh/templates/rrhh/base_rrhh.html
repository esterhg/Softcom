<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}RRHH{% endblock %} | SoftCom CCG</title>
    <style>
        @font-face {
            font-family: 'Artifakt Element';
            src: url('https://raw.githubusercontent.com/Autodesk/standard-surface/master/style/fonts/Artifakt/Artifakt%20Element%20Medium.woff2') format('woff2');
            font-weight: 400; font-style: normal; font-display: swap;
        }
        @font-face {
            font-family: 'Artifakt Element';
            src: url('https://raw.githubusercontent.com/Autodesk/standard-surface/master/style/fonts/Artifakt/Artifakt%20Legend%20Bold.woff2') format('woff2');
            font-weight: 700; font-style: normal; font-display: swap;
        }
        :root {
            --fiori-primary: #0070f2; --fiori-bg: #eff2f5; --fiori-card-bg: #ffffff;
            --fiori-text: #32363a; --fiori-text-secondary: #6a6d70; --fiori-border: #d9d9d9;
            --fiori-success: #107e3e; --fiori-warning: #e9730c; --fiori-error: #bb0000;
        }
        body { font-family: 'Artifakt Element', 'Outfit', sans-serif; background: var(--fiori-bg); color: var(--fiori-text); }
        .sap-card { background: var(--fiori-card-bg); border: 1px solid var(--fiori-border); border-radius: 0.5rem; box-shadow: 0 0.125rem 0.25rem rgba(0,0,0,0.08); margin-bottom: 24px; overflow: hidden; }
        .sap-table { width: 100%; border-collapse: collapse; font-size: 0.86rem; }
        .sap-table th { text-align: left; padding: 10px 12px; background: #f0f4f8; border-bottom: 2px solid var(--fiori-border); font-size: 0.72rem; text-transform: uppercase; color: var(--fiori-text-secondary); font-weight: 700; white-space: nowrap; }
        .sap-table td { padding: 9px 12px; border-bottom: 1px solid #eef1f4; vertical-align: middle; }
        .sap-table tbody tr:hover td { background: #f8fafc; }
        .btn-sap { padding: 8px 16px; border-radius: 4px; border: 1px solid var(--fiori-border); background: #fff; color: var(--fiori-text); font-weight: 600; font-size: 0.88rem; text-decoration: none; display: inline-flex; align-items: center; gap: 6px; font-family: inherit; cursor: pointer; }
        .btn-sap-primary { background: var(--fiori-primary); border-color: var(--fiori-primary); color: #fff; }
        .btn-sap:hover { filter: brightness(0.96); }
        .badge-sap { display: inline-block; padding: 2px 10px; border-radius: 4px; font-size: 0.72rem; font-weight: 600; background: #eff6ff; color: #1d4ed8; }
        .badge-ok { background: #dcfce7; color: #166534; }
        .badge-pend { background: #f1f5f9; color: #475569; }
        .rh-wrap { max-width: 1400px; margin: 0 auto; padding: 32px 40px; }
        .rh-head h1 { font-size: 1.6rem; font-weight: 700; margin: 0; }
        .rh-head p { color: var(--fiori-text-secondary); font-size: .92rem; margin: 4px 0 20px; }
        .rh-muted { color: var(--fiori-text-secondary); }
        .rh-empty { padding: 40px; text-align: center; color: var(--fiori-text-secondary); }
        .form-label { font-size: .75rem; font-weight: 700; text-transform: uppercase; color: var(--fiori-text-secondary); }
        .modal-content { border-radius: 0.5rem; }
    </style>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    {% block extrahead %}{% endblock %}
</head>
<body>
    {% block content %}{% endblock %}

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script>
    {% for m in messages %}
        Swal.fire({
            toast: true, position: 'top-end', timer: 5000, showConfirmButton: false, timerProgressBar: true,
            icon: '{% if m.level_tag == "error" %}error{% elif m.level_tag == "success" %}success{% else %}info{% endif %}',
            title: '{{ m.message|escapejs }}'
        });
    {% endfor %}
    </script>
    {% block extrajs %}{% endblock %}
</body>
</html>
