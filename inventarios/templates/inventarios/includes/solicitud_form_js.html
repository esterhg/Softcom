{% load l10n %}    <script>
        $(document).ready(function() {
            // Estado global — IDs son strings (GUIDs)
            window.selectedItems = new Map();
            let html5QrScanner = null;
            let currentCategoryId = "";
            let lastResults = [];
            let isNoTecnica = false;

            // Toggle "Solicitud No Técnica"
            $('#chk-no-tecnica').on('change', function() {
                isNoTecnica = $(this).is(':checked');
                if (isNoTecnica) {
                    $('#ot-section').slideUp(200);
                    $('#orden_trabajo').val('');
                    clearOT();
                    clearTicket();
                } else {
                    $('#ot-section').slideDown(200);
                }
            });

            window.openSelector = function() {
                $('#selectorOverlay').addClass('active');
                setTimeout(() => $('#material-search').focus(), 300);
            };

            window.closeSelector = function() {
                $('#selectorOverlay').removeClass('active');
            };

            // === CASCADING: Edificio → Nivel ===
            $('#edificio_destino').on('change', function() {
                const edId = $(this).val();
                const $nivel = $('#nivel_destino');
                if (!edId) {
                    $nivel.html('<option value="">-- Seleccione Edificio primero --</option>').prop('disabled', true);
                    return;
                }
                $nivel.html('<option value="">Cargando...</option>').prop('disabled', true);
                $.get('{% url "inventarios:api_niveles_edificio" %}', { edificio_id: edId }, function(data) {
                    let opts = '<option value="">-- Seleccione Nivel --</option>';
                    data.results.forEach(n => {
                        opts += `<option value="${n.id}">${n.nombre}</option>`;
                    });
                    $nivel.html(opts).prop('disabled', false);
                });
            });

            // === BUSCADOR DE ÓRDENES DE TRABAJO ===
            let otDebounce = null;

            $('#ot-search').on('input', function() {
                const q = $(this).val().trim();
                clearTimeout(otDebounce);
                if (q.length < 2) {
                    $('#ot-results').hide();
                    return;
                }
                otDebounce = setTimeout(function() {
                    $.get('{% url "inventarios:api_search_ot" %}', { q: q }, function(data) {
                        if (data.results.length === 0) {
                            $('#ot-results').html('<div style="padding:12px; text-align:center; color:#999; font-size:13px;">Sin resultados</div>').show();
                            return;
                        }
                        let html = '';
                        data.results.forEach(ot => {
                            html += `
                                <div class="ot-result-item" data-id="${ot.id}" data-codigo="${ot.codigo}" data-nombre="${ot.nombre}" data-edificio="${ot.edificio_id || ''}" data-nivel="${ot.nivel_id || ''}" data-otnp="${ot.sin_justificacion ? '1' : '0'}" style="padding:10px 12px; border-bottom:1px solid #f0f0f0; cursor:pointer; font-size:13px;">
                                    <div style="font-weight:700; color:#0a6ed1;">${ot.codigo}</div>
                                    <div style="color:#333; margin-top:2px;">${ot.nombre}</div>
                                    <div style="color:#888; font-size:11px; margin-top:1px;">${ot.ubicacion} · ${ot.tipo} · ${ot.estado}</div>
                                </div>
                            `;
                        });
                        $('#ot-results').html(html).show();
                    });
                }, 300);
            });

            $('#ot-search').on('focus', function() {
                if ($(this).val().trim().length >= 2) {
                    $(this).trigger('input');
                }
            });

            $(document).on('click', '.ot-result-item', function() {
                const id = $(this).data('id');
                const codigo = $(this).data('codigo');
                const nombre = $(this).data('nombre');
                const edificioId = $(this).data('edificio');
                const nivelId = $(this).data('nivel');
                
                $('#orden_trabajo').val(id);
                window.otSinJustificacion = String($(this).data('otnp')) === '1';
                $('#ot-search').hide();
                $('#ot-selected-code').text(codigo);
                $('#ot-selected-name').text(nombre);
                $('#ot-selected').show();
                $('#ot-results').hide();
                toggleDescRequired();
                
                // Autocompletar Edificio y Nivel si vienen de la OT
                if (edificioId) {
                    $('#edificio_destino').val(edificioId).trigger('change');
                    
                    // Esperar a que carguen los niveles para preseleccionar el nivel de la OT
                    if (nivelId) {
                        const checkNiveles = setInterval(() => {
                            if (!$('#nivel_destino').prop('disabled')) {
                                $('#nivel_destino').val(nivelId);
                                clearInterval(checkNiveles);
                            }
                        }, 100);
                        
                        // Fallback: limpiar intervalo si tarda demasiado (ej: 3 segs)
                        setTimeout(() => clearInterval(checkNiveles), 3000);
                    }
                }

                // Verificar si la OT ya tiene una solicitud pendiente
                fetch(`/inventarios/api/check-ot-solicitud/${id}/`)
                    .then(r => r.json())
                    .then(d => {
                        if (d.has_pending) {
                            Swal.fire({
                                title: 'Solicitud existente',
                                html: `Esta OT ya tiene una solicitud <strong>#${d.solicitud.id}</strong> en estado <strong>${d.solicitud.estado}</strong> con ${d.solicitud.items_count} materiales.<br><br>¿Quieres continuar con esa solicitud anterior?`,
                                icon: 'question',
                                showCancelButton: true,
                                confirmButtonText: 'Sí, ver solicitud',
                                cancelButtonText: 'No, crear nueva'
                            }).then(res => {
                                if (res.isConfirmed) {
                                    window.location.href = `/inventarios/mobile/pedidos/${d.solicitud.id}/`;
                                }
                            });
                        }
                    })
                    .catch(() => {});
            });

            window.clearOT = function() {
                $('#orden_trabajo').val('');
                window.otSinJustificacion = false;
                $('#ot-search').val('').show();
                $('#ot-selected').hide();
                $('#btn-crear-ot-rapida').show();
                toggleDescRequired();
            };

            window.crearOtRapida = function() {
                // Limpiar posible OT anterior en localStorage
                localStorage.removeItem('ot_creada_id');
                localStorage.removeItem('ot_creada_codigo');

                // Abrir la interfaz de crear OT en nueva pestaña
                window.open('/mantenimiento/app/ot/crear-no-programada/?callback=solicitud', '_blank');
                
                Swal.fire({
                    icon: 'info',
                    title: 'Creando OT...',
                    html: 'Se abrió el formulario de <b>Nueva OT</b> en otra pestaña.<br><br>Cuando la guardes, se vinculará automáticamente aquí.',
                    confirmButtonText: 'Ya la creé, vincular',
                    showCancelButton: true,
                    cancelButtonText: 'Cancelar',
                    confirmButtonColor: '#107e3e',
                }).then((result) => {
                    if (result.isConfirmed) {
                        // Intentar leer la OT del localStorage
                        const otId = localStorage.getItem('ot_creada_id');
                        const otCodigo = localStorage.getItem('ot_creada_codigo');
                        if (otId && otCodigo) {
                            $('#orden_trabajo').val(otId);
                            window.otSinJustificacion = true; // OTNP recién creada
                            $('#ot-search').hide();
                            $('#ot-selected-code').text(otCodigo);
                            $('#ot-selected-name').text('(Recién creada)');
                            $('#ot-selected').show();
                            $('#btn-crear-ot-rapida').hide();
                            toggleDescRequired();
                            localStorage.removeItem('ot_creada_id');
                            localStorage.removeItem('ot_creada_codigo');
                            Swal.fire({ toast: true, position: 'top', icon: 'success', title: `OT ${otCodigo} vinculada`, showConfirmButton: false, timer: 1500 });
                        } else {
                            Swal.fire({
                                icon: 'info',
                                title: 'OT no detectada',
                                html: 'No se detectó la OT automáticamente. Puedes buscarla por código en el campo de búsqueda.',
                                confirmButtonText: 'OK'
                            });
                        }
                    }
                });

                // Escuchar cambios en localStorage (cuando la otra pestaña guarda la OT)
                window.addEventListener('storage', function otListener(e) {
                    if (e.key === 'ot_creada_id' && e.newValue) {
                        const otId = e.newValue;
                        const otCodigo = localStorage.getItem('ot_creada_codigo') || 'OT Nueva';
                        $('#orden_trabajo').val(otId);
                        window.otSinJustificacion = true; // OTNP recién creada
                        $('#ot-search').hide();
                        $('#ot-selected-code').text(otCodigo);
                        $('#ot-selected-name').text('(Recién creada)');
                        $('#ot-selected').show();
                        $('#btn-crear-ot-rapida').hide();
                        toggleDescRequired();
                        Swal.close();
                        Swal.fire({ toast: true, position: 'top', icon: 'success', title: `OT ${otCodigo} vinculada`, showConfirmButton: false, timer: 1500 });
                        window.removeEventListener('storage', otListener);
                    }
                });
            };

            // Cerrar resultados al hacer clic fuera
            $(document).on('click', function(e) {
                if (!$(e.target).closest('#ot-search, #ot-results').length) {
                    $('#ot-results').hide();
                }
                if (!$(e.target).closest('#ticket-search, #ticket-results').length) {
                    $('#ticket-results').hide();
                }
                if (!$(e.target).closest('#entregar-search, #entregar-results').length) {
                    $('#entregar-results').hide();
                }
            });

            // --- Buscador "Entregar A" (personal) ---
            let personalCache = null;

            $('#entregar-search').on('input', async function() {
                const q = $(this).val().trim().toLowerCase();
                if (q.length < 2) { $('#entregar-results').hide(); return; }

                // Cargar cache de usuarios si no existe
                if (!personalCache) {
                    try {
                        const res = await fetch('/callcenter/get-assignable-users/');
                        const data = await res.json();
                        personalCache = Object.entries(data).map(([id, nombre]) => ({ id, nombre }));
                    } catch(e) { return; }
                }

                // Filtrar localmente
                const filtered = personalCache.filter(p => p.nombre.toLowerCase().includes(q)).slice(0, 10);
                if (filtered.length === 0) { $('#entregar-results').hide(); return; }

                let html = '';
                filtered.forEach(p => {
                    html += `<div class="entregar-item" data-id="${p.id}" data-name="${p.nombre}" style="padding:10px 14px; cursor:pointer; border-bottom:1px solid #f0f0f0; font-size:13px; display:flex; align-items:center; gap:8px;">
                        <ion-icon name="person-outline" style="font-size:16px; color:#6a6d70;"></ion-icon>
                        ${p.nombre}
                    </div>`;
                });
                $('#entregar-results').html(html).show();

                $('.entregar-item').on('click', function() {
                    const id = $(this).data('id');
                    const name = $(this).data('name');
                    $('#entregar_a_id').val(id);
                    $('#entregar-search').hide();
                    $('#entregar-selected-name').text(name);
                    $('#entregar-selected').show();
                    $('#entregar-results').hide();
                });
            });

            window.clearEntregarA = function() {
                $('#entregar_a_id').val('');
                $('#entregar-search').val('').show();
                $('#entregar-selected').hide();
            };

            // === Vínculo: OTNP/OT o Ticket (uno u otro) ===
            function setVinculo(tipo) {
                $('.vinc-tab').each(function() {
                    const activo = $(this).data('tipo') === tipo;
                    $(this).attr('aria-selected', activo ? 'true' : 'false')
                           .css({ background: activo ? '#0070f2' : '#fff', color: activo ? '#fff' : '#32363a' });
                });
                if (tipo === 'ticket') {
                    clearOT();
                    $('#ot-block').hide();
                    $('#ticket-block').show();
                } else {
                    clearTicket();
                    $('#ticket-block').hide();
                    $('#ot-block').show();
                }
            }
            $('.vinc-tab').on('click', function() { setVinculo($(this).data('tipo')); });

            let ticketDebounce = null;
            $('#ticket-search').on('input', function() {
                const q = $(this).val().trim();
                clearTimeout(ticketDebounce);
                if (q.length < 2) { $('#ticket-results').hide(); return; }
                ticketDebounce = setTimeout(function() {
                    $.get('{% url "inventarios:api_search_tickets" %}', { q: q }, function(data) {
                        if (!data.results.length) {
                            $('#ticket-results').html('<div style="padding:12px; text-align:center; color:#999; font-size:13px;">Sin resultados</div>').show();
                            return;
                        }
                        const $list = $('<div>');
                        data.results.forEach(t => {
                            const $it = $('<div class="ticket-result-item" style="padding:10px 12px; border-bottom:1px solid #f0f0f0; cursor:pointer; font-size:13px;"></div>');
                            $it.attr('data-id', t.id).attr('data-codigo', t.codigo).attr('data-nombre', t.nombre);
                            $it.append($('<div style="font-weight:700; color:#0a6ed1;"></div>').text('Ticket ' + t.codigo));
                            $it.append($('<div style="color:#333; margin-top:2px;"></div>').text(t.nombre));
                            $it.append($('<div style="color:#888; font-size:11px; margin-top:1px;"></div>').text(t.ubicacion));
                            $list.append($it);
                        });
                        $('#ticket-results').empty().append($list.children()).show();
                    });
                }, 300);
            });
            $(document).on('click', '.ticket-result-item', function() {
                $('#ticket_id').val($(this).attr('data-id'));
                $('#ticket-search').hide();
                $('#ticket-selected-code').text('Ticket ' + $(this).attr('data-codigo'));
                $('#ticket-selected-name').text($(this).attr('data-nombre'));
                $('#ticket-selected').show();
                $('#ticket-results').hide();
                toggleDescRequired();
            });
            window.clearTicket = function() {
                $('#ticket_id').val('');
                $('#ticket-search').val('').show();
                $('#ticket-selected').hide();
                $('#ticket-results').hide();
                toggleDescRequired();
            };

            // Mostrar/ocultar asterisco de obligatoriedad en la descripción
            function toggleDescRequired() {
                const hasTicket = !!$('#ticket_id').val();
                const hasOT = !!$('#orden_trabajo').val() || hasTicket;
                // Solo con OTNP o ticket vinculado se oculta la justificación
                const ocultar = hasTicket || (hasOT && !!window.otSinJustificacion);
                $('#desc-group').toggle(!ocultar);
                if (ocultar) $('#comentarios').val('');
                $('#desc-required').toggle(!hasOT);
                $('#comentarios').attr('placeholder', hasOT ? 'Notas adicionales (opcional)...' : 'Obligatorio si no hay OT — Describa el motivo...');
            }
            toggleDescRequired(); // estado inicial

            // Referencia directa al drawer-body — NO usar $(document) porque
            // .bottom-drawer tiene onclick="event.stopPropagation()" que bloquea
            // la propagación al document.
            const $drawer = $('.drawer-body');

            // Filtro por categoría — bind directo al contenedor del drawer
            $drawer.on('click', '.chip', function() {
                $('.chip').removeClass('active');
                $(this).addClass('active');
                currentCategoryId = String($(this).attr('data-id') || "");
                performSearch();
            });

            $('#material-search').on('input', function() {
                performSearch();
            });

            function performSearch() {
                const q = $('#material-search').val().trim();
                const ubicacionId = $('#ubicacion_origen').val();
                
                if (q.length < 3 && currentCategoryId === "") {
                    $('#search-results').html('<div style="padding:30px; text-align:center; color:#999;"><ion-icon name="search-outline" style="font-size:32px; opacity:0.3;"></ion-icon><p>Escriba para buscar...</p></div>');
                    return;
                }

                $('#search-results').html('<div class="skeleton"></div><div class="skeleton"></div>');

                const stockWarning = !ubicacionId ? ' <small style="color:var(--sap-error)">(Global)</small>' : '';

                $.get('{% url "inventarios:api_list_materials" %}', { 
                    q: q, 
                    category: currentCategoryId,
                    ubicacion: ubicacionId,
                    page: 1 
                }, function(data) {
                    let html = '';
                    lastResults = data.results || [];
                    if (lastResults.length > 0) {
                        lastResults.forEach((m, index) => {
                            const mid = String(m.id);
                            const isAdded = window.selectedItems.has(mid);
                            const allowedStyle = '';
                            const approvalBadge = !m.is_allowed ? '<p style="font-size:10px; color:#e9730c; margin:2px 0 0;">⚠️ Requiere aprobación del departamento responsable</p>' : '';
                            const addedBadge = isAdded ? '<span style="background:#0a6ed1; color:white; font-size:9px; padding:2px 6px; border-radius:2px; margin-left:6px;">✓ Añadido</span>' : '';
                            const iconName = isAdded ? 'checkmark-circle' : 'add-circle';
                            const iconColor = isAdded ? '#2b7d2b' : '#0a6ed1';
                            
                            const descSnippet = m.descripcion ? `<p style="font-size:11px; margin:2px 0 0; color:#888; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">${m.descripcion.substring(0, 60)}${m.descripcion.length > 60 ? '...' : ''}</p>` : '';
                            
                            html += `
                                <div class="material-item" data-index="${index}" data-needs-approval="${!m.is_allowed}" style="border:1px solid #e8eaed; border-radius:4px; margin-bottom:8px; display:flex; padding:12px; align-items:center; cursor:pointer; ${allowedStyle}">
                                    <img src="${m.image_url}" alt="" style="width:48px; height:48px; border-radius:6px; object-fit:cover; margin-right:12px; flex-shrink:0; background:#f0f4f8;" onerror="this.style.display='none';this.nextElementSibling.style.display='flex'">
                                    <div style="width:48px; height:48px; background:#f0f4f8; border-radius:6px; display:none; align-items:center; justify-content:center; margin-right:12px; flex-shrink:0;">
                                        <ion-icon name="cube-outline" style="font-size:22px; color:#8a9bb5;"></ion-icon>
                                    </div>
                                    <div style="flex:1; min-width:0;">
                                        <p style="font-size:14px; margin:0; font-weight:700;">${m.nombre}${addedBadge}</p>
                                        <p style="font-size:11px; margin:0; color:#666; margin-top:2px;">${m.sku} | Stock: ${m.stock}${stockWarning}</p>
                                        ${descSnippet}
                                        ${approvalBadge}
                                    </div>
                                    <ion-icon name="${iconName}" style="color:${iconColor}; font-size:30px; pointer-events:none; flex-shrink:0;"></ion-icon>
                                </div>
                            `;
                        });
                        $('#search-results').html(html);
                    } else {
                        $('#search-results').html('<div style="padding:30px; text-align:center; color:#999;"><p>Sin resultados.</p></div>');
                    }
                }).fail(function() {
                    $('#search-results').html('<div style="padding:30px; text-align:center; color:#bb0000;"><p>Error al buscar. Intente de nuevo.</p></div>');
                });
            }

            // Click en material — bind al drawer, NO al document
            $drawer.on('click', '.material-item', function(e) {
                e.preventDefault();
                const index = parseInt($(this).attr('data-index'));
                const mat = lastResults[index];
                if (!mat) return;

                // Si requiere aprobación, advertir pero permitir agregar
                if ($(this).attr('data-needs-approval') === 'true') {
                    Swal.fire({ toast: true, position: 'top', icon: 'warning', title: 'Requiere aprobación del depto. responsable', showConfirmButton: false, timer: 2000 });
                }

                const mid = String(mat.id);
                if (window.selectedItems.has(mid)) {
                    Swal.fire({ toast: true, position: 'top', icon: 'info', title: 'Ya agregado', showConfirmButton: false, timer: 600 });
                    return;
                }

                // Agregar al mapa
                window.selectedItems.set(mid, {
                    id: mid,
                    nombre: mat.nombre,
                    sku: mat.sku,
                    descripcion: mat.descripcion || '',
                    image_url: mat.image_url || '',
                    unidad: mat.unidad,
                    stock: mat.stock || 0,
                    cantidad: 1,
                    es_tecnico: mat.es_tecnico || false
                });
                renderItems();

                // Feedback visual en el item
                $(this).find('ion-icon:last-child').attr('name', 'checkmark-circle').css('color', '#2b7d2b');

                Swal.fire({ toast: true, position: 'top-end', icon: 'success', title: 'Agregado', showConfirmButton: false, timer: 800 });
            });

            function renderItems() {
                const container = $('#items-container');
                const countLabel = $('#item-count');
                if (window.selectedItems.size === 0) {
                    container.html('<div style="padding:20px; text-align:center; color:#999;"><p>No hay materiales seleccionados.</p></div>');
                    countLabel.text(0);
                    return;
                }
                let html = '';
                window.selectedItems.forEach(item => {
                    const itemDesc = item.descripcion ? `<div style="font-size:11px; color:#888; margin-top:2px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">${item.descripcion.substring(0, 50)}${item.descripcion.length > 50 ? '...' : ''}</div>` : '';
                    const stockColor = item.stock > 0 ? '#107e3e' : '#bb0000';
                    const tecnicoBadge = item.es_tecnico ? '<span style="display:inline-block; background:#fef3c7; color:#92400e; font-size:9px; font-weight:700; padding:1px 6px; border-radius:3px; margin-left:6px;">⚙️ TÉCNICO</span>' : '';
                    html += `
                        <div class="item-row" data-id="${item.id}">
                            <div class="item-main">
                                <div style="min-width:50px; text-align:center; margin-right:10px;">
                                    <div style="font-size:1.8rem; font-weight:800; color:${stockColor}; line-height:1;">${item.stock}</div>
                                    <div style="font-size:9px; color:#6a6d70; text-transform:uppercase; font-weight:600;">stock</div>
                                </div>
                                <div style="flex:1; min-width:0;">
                                    <div style="font-weight:700; font-size:15px;">${item.nombre}${tecnicoBadge}</div>
                                    <div style="font-size:11px; color:#666;">${item.sku} · ${item.unidad}</div>
                                    ${itemDesc}
                                </div>
                                <button class="remove-btn" onclick="removeItem('${item.id}')"><ion-icon name="trash-outline"></ion-icon></button>
                            </div>
                            <div class="qty-controls">
                                <div class="qty-btn" onclick="updateQty('${item.id}', -1)">-</div>
                                <input type="number" class="qty-input" value="${item.cantidad}" onchange="setQty('${item.id}', this.value)">
                                <div class="qty-btn" onclick="updateQty('${item.id}', 1)">+</div>
                            </div>
                        </div>
                    `;
                });
                container.html(html);
                countLabel.text(window.selectedItems.size);
            }

            window.updateQty = function(id, delta) {
                const item = window.selectedItems.get(String(id));
                if (item) {
                    item.cantidad = Math.max(0.1, Math.round((item.cantidad + delta) * 10) / 10);
                    renderItems();
                }
            };
            window.setQty = function(id, val) {
                const item = window.selectedItems.get(String(id));
                if (item) {
                    item.cantidad = Math.max(0.1, parseFloat(val));
                    renderItems();
                }
            };
            window.removeItem = function(id) {
                window.selectedItems.delete(String(id));
                renderItems();
            };

            $('#btn-open-scanner').click(function() {
                $('#scanner-overlay').css('display', 'flex');
                if (!html5QrScanner) html5QrScanner = new Html5Qrcode("qr-reader");
                html5QrScanner.start({ facingMode: "environment" }, { fps: 10, qrbox: 250 }, 
                    (text) => { $('#btn-close-scanner').click(); openSelector(); $('#material-search').val(text).trigger('input'); },
                    (err) => {}
                );
            });

            $('#btn-close-scanner').click(function() {
                if (html5QrScanner) html5QrScanner.stop().catch(()=>{});
                $('#scanner-overlay').hide();
            });

            $('#btn-submit').click(function() {
                const ubicacionId = $('#ubicacion_origen').val();
                // OT u otro vínculo válido (ticket) cuentan igual para las validaciones
                const otId = $('#orden_trabajo').val() || $('#ticket_id').val();
                const comentarios = $('#comentarios').val().trim();
                const edificioId = $('#edificio_destino').val();
                const nivelId = $('#nivel_destino').val();

                if (!ubicacionId) {
                    Swal.fire('Bodega requerida', 'Seleccione la bodega de origen.', 'warning');
                    $('#ubicacion_origen').focus();
                    return;
                }
                if (!edificioId) {
                    Swal.fire('Destino requerido', 'Seleccione el edificio de destino.', 'warning');
                    $('#edificio_destino').focus();
                    return;
                }
                if (window.selectedItems.size === 0) {
                    Swal.fire('Sin materiales', 'Agregue al menos un material.', 'warning');
                    return;
                }
                if (!otId && !comentarios) {
                    // Si es no técnica, solo requiere comentarios
                    if (isNoTecnica) {
                        Swal.fire('Descripción requerida', 'Debe escribir un motivo/descripción para solicitudes no técnicas.', 'warning');
                        $('#comentarios').focus();
                        return;
                    }
                    // Verificar si hay materiales técnicos
                    const tecnicos = Array.from(window.selectedItems.values()).filter(i => i.es_tecnico);
                    if (tecnicos.length > 0) {
                        const nombres = tecnicos.slice(0, 3).map(t => t.nombre).join(', ');
                        Swal.fire({
                            icon: 'warning',
                            title: 'Orden de Trabajo requerida',
                            html: `Los siguientes materiales son <strong>técnicos</strong> y requieren vincularse con una OTNP o un Ticket:<br><br><em>${nombres}</em>${tecnicos.length > 3 ? ` y ${tecnicos.length - 3} más...` : ''}`,
                            confirmButtonText: 'Entendido'
                        });
                        $('#ot-search').focus();
                        return;
                    }
                    Swal.fire('Descripción requerida', 'Si no vincula una OTNP o un Ticket, debe escribir un motivo/descripción.', 'warning');
                    $('#comentarios').focus();
                    return;
                }
                // Validar materiales técnicos incluso si hay comentarios pero no OT
                if (!otId && !isNoTecnica) {
                    const tecnicos = Array.from(window.selectedItems.values()).filter(i => i.es_tecnico);
                    if (tecnicos.length > 0) {
                        const nombres = tecnicos.slice(0, 3).map(t => t.nombre).join(', ');
                        Swal.fire({
                            icon: 'warning',
                            title: 'Orden de Trabajo obligatoria',
                            html: `Los siguientes materiales son <strong>técnicos</strong> y requieren vincularse con una OTNP o un Ticket:<br><br><em>${nombres}</em>${tecnicos.length > 3 ? ` y ${tecnicos.length - 3} más...` : ''}`,
                            confirmButtonText: 'Entendido'
                        });
                        $('#ot-search').focus();
                        return;
                    }
                }
                
                Swal.fire({
                    title: '¿Enviar solicitud?',
                    icon: 'question',
                    showCancelButton: true,
                    confirmButtonText: 'Sí, enviar'
                }).then(r => {
                    if (r.isConfirmed) {
                        submitSolicitud('PENDIENTE');
                    }
                });
            });

            // Guardar como borrador (sin validaciones estrictas)
            $('#btn-guardar').click(function() {
                if (window.selectedItems.size === 0) {
                    Swal.fire('Sin materiales', 'Agregue al menos un material para guardar.', 'warning');
                    return;
                }
                submitSolicitud('BORRADOR');
            });

            {% if ot_pre %}
            // OT preseleccionada (?ot=N): se reutiliza el mismo flujo que al elegirla en el buscador
            // (autocompleta edificio/nivel y avisa si ya tiene una solicitud pendiente).
            (function () {
                const pre = {
                    id: {{ ot_pre.id|unlocalize }},
                    codigo: "{{ ot_pre.codigo_de_orden|default:''|escapejs }}",
                    nombre: "{{ ot_pre_nombre|escapejs }}"
                };
                const sintetico = (r) => $('<div class="ot-result-item" style="display:none"></div>')
                    .attr({ 'data-id': r.id, 'data-codigo': r.codigo, 'data-nombre': r.nombre,
                            'data-edificio': r.edificio_id || '', 'data-nivel': r.nivel_id || '',
                            'data-otnp': r.sin_justificacion ? '1' : '0' })
                    .data({ id: r.id, codigo: r.codigo, nombre: r.nombre,
                            edificio: r.edificio_id || '', nivel: r.nivel_id || '',
                            otnp: r.sin_justificacion ? '1' : '0' })
                    .appendTo('body').trigger('click').remove();
                $.get('{% url "inventarios:api_search_ot" %}', { q: pre.codigo || String(pre.id) })
                    .done(function (data) {
                        const hit = (data.results || []).find(o => String(o.id) === String(pre.id));
                        sintetico(hit || { id: pre.id, codigo: pre.codigo || ('OT #' + pre.id), nombre: pre.nombre });
                    })
                    .fail(function () { sintetico({ id: pre.id, codigo: pre.codigo || ('OT #' + pre.id), nombre: pre.nombre }); });
            })();
            {% endif %}

            function submitSolicitud(estado) {
                const ubicacionId = $('#ubicacion_origen').val();
                const otId = $('#orden_trabajo').val();
                const comentarios = $('#comentarios').val().trim();
                const edificioId = $('#edificio_destino').val();
                const nivelId = $('#nivel_destino').val();
                const entregarAId = $('#entregar_a_id').val();
                const itemsArr = Array.from(window.selectedItems.values()).map(it => ({ material_id: it.id, cantidad: it.cantidad }));

                $.ajax({
                    url: '{% url "inventarios:cart_checkout" %}',
                    method: 'POST',
                    headers: { 'X-CSRFToken': '{{ csrf_token }}' },
                    data: {
                        ubicacion_origen: ubicacionId,
                        edificio_destino: edificioId,
                        nivel_destino: nivelId,
                        orden_trabajo: otId,
                        ticket: $('#ticket_id').val(),
                        entregar_a: entregarAId,
                        comentarios: comentarios,
                        estado: estado,
                        ajax_mode: 'true',
                        items_json: JSON.stringify(itemsArr)
                    },
                    success: (res) => {
                        const msg = estado === 'BORRADOR' ? 'Borrador guardado correctamente.' : res.message;
                        Swal.fire('¡Éxito!', msg, 'success').then(() => {
                            window.location.href = '{% url "inventarios:mobile_lista_pedidos" %}';
                        });
                    },
                    error: (xhr) => {
                        Swal.fire('Error', 'No se pudo procesar la solicitud.', 'error');
                    }
                });
            }
        });
    </script>
